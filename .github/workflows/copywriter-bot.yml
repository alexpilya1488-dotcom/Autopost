name: Copywriter Bot

# Проверяет Telegram на новые брифы каждые ~15 минут, готовит черновик
# текста (Gemini/Groq) и присылает обратно в личку автору. Не публикует и
# не общается с клиентами — только ускоряет подготовку черновика.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  check-and-draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # нужно, чтобы закоммитить обновлённый offset обратно в репозиторий
    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: Проверить брифы и ответить черновиком
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python copywriter_bot.py

      - name: Закоммитить состояние (последний обработанный update_id)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add telegram_copywriter_state.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: обновить состояние copywriter-бота [skip ci]"
          git push
